name: secret-scan

on:
  pull_request:
    paths:
      - "secrets-demo/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: secrets-demo
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false
      - run: terraform init
      - run: terraform plan -out=tfplan
        env:
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
      - name: Fail if the secret is in the saved plan
        run: |
          terraform show -json tfplan > plan.json
          if grep -qF "$DB_PASSWORD" plan.json; then
            echo "::error::The secret value was found in the plan JSON."
            echo "Matching JSON paths (values are never printed):"
            jq -r 'paths(scalars) as $p | select(getpath($p) | tostring | contains(env.DB_PASSWORD)) | $p | map(tostring) | join(".")' plan.json
            exit 1
          fi
          echo "No secret found in the plan JSON."
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
